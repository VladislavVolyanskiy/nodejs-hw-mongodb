tags:
  - Auth
summary: 'Login user'
operationId: loginUser
description: 'Login a user and return token'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: 'User email'
            example: 'John_Doe@gmail.com'
          password:
            type: string
            description: 'User password'
            example: 'anypassword95175'
  description: 'User credentials required for authentication'
responses:
  '200':
    description: Successfully logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in!
            data:

                type: string
                example: 'dGhpcy5pcy5hLmV4YW1wbGV...'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
